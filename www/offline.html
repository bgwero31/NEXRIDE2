<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>NEXRIDE Offline</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 50% 15%,rgba(0,170,255,.35),transparent 35%),linear-gradient(145deg,#020617,#07111f 55%,#020617);color:white;font-family:Arial,sans-serif;text-align:center;padding:28px}.card{width:min(92vw,430px);padding:34px 24px;border-radius:32px;background:rgba(10,22,42,.82);border:1px solid rgba(56,189,248,.28);box-shadow:0 24px 70px rgba(0,0,0,.45),0 0 40px rgba(0,140,255,.2);backdrop-filter:blur(22px)}.logo{width:92px;height:92px;border-radius:28px;margin:0 auto 18px;display:grid;place-items:center;background:linear-gradient(135deg,#00d4ff,#0057ff 55%,#020617);box-shadow:0 0 32px rgba(0,174,255,.55);font-size:34px;font-weight:900}h1{margin:0 0 8px;font-size:32px;letter-spacing:-1px}p{margin:0 auto 24px;color:#bfd3ee;line-height:1.5;font-size:16px}button{width:100%;border:0;border-radius:20px;padding:17px 20px;color:white;font-size:17px;font-weight:800;background:linear-gradient(135deg,#06b6d4,#004cff);box-shadow:0 14px 35px rgba(0,102,255,.35)}.tag{margin-top:18px;color:#5ecbff;font-weight:800;font-size:12px;letter-spacing:1.8px}
    </style>
  </head>
  <body><div class="card"><div class="logo">NR</div><h1>You’re offline</h1><p>NEXRIDE could not connect. Check your internet connection and try again.</p><button onclick="location.reload()">Try again</button><div class="tag">@NEXRIDE</div></div></body>
</html>
